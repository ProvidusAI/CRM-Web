allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  "@portabletext/sanity-bridge": 1.2.14
  # xstate 5.33 makes every Studio edit dialog close on the first keystroke
  # (Portable Text editor state collapses on patch). Mirrored in package.json
  # "overrides" for npm-based installs, which ignore this file.
  xstate: 5.31.1

patchedDependencies:
  '@sanity/table@2.0.1': patches/@sanity__table@2.0.1.patch
